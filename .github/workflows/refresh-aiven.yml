name: Refresh Aiven database

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-aiven-database
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          python -m pip install
          'mcp[cli]>=1.6.0,<2'
          'requests>=2.31'
          'pandas>=2.0'
          'psycopg2-binary>=2.9'

      - name: Refresh database
        env:
          TIMESCALE_HOST: ${{ secrets.TIMESCALE_HOST }}
          TIMESCALE_PORT: ${{ secrets.TIMESCALE_PORT }}
          TIMESCALE_DBNAME: ${{ secrets.TIMESCALE_DBNAME }}
          TIMESCALE_USER: ${{ secrets.TIMESCALE_USER }}
          TIMESCALE_PASSWORD: ${{ secrets.TIMESCALE_PASSWORD }}
          TIMESCALE_SSL: require
        run: |
          for name in TIMESCALE_HOST TIMESCALE_PORT TIMESCALE_DBNAME TIMESCALE_USER TIMESCALE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

          python - <<'PY'
          import sys
          from server import refresh_database

          result = refresh_database()
          print(result)
          if "stage failed:" in result or result.startswith("Could not connect to TimescaleDB:"):
              sys.exit(1)
          PY